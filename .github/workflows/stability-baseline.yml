name: V2 Stability Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stability-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: macOS / Python 3.12 / unittest
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile core modules
        run: |
          python -m py_compile \
            app.py main.py models.py epub_processor.py \
            audio_processor.py generation_manager.py file_manager.py

      - name: Run V2 stability baseline
        run: python -m unittest discover -s tests -v
